version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/Tests"
    schedule:
      interval: "weekly"
    target-branch: "main"
    labels:
      - "Tests"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    labels:
      - "github-actions"

  - package-ecosystem: "nuget"
    directory: "/Cli"
    schedule:
      interval: "weekly"
    target-branch: "main"
    labels:
      - "Cli"

  - package-ecosystem: "nuget"
    directory: "/GitService"
    schedule:
      interval: "weekly"
    target-branch: "main"
    labels:
      - "GitService"

  - package-ecosystem: "nuget"
    directory: "/Shared"
    schedule:
      interval: "weekly"
    target-branch: "main"
    labels:
      - "Shared"
